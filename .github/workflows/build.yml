name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt upload key
        env:
          SIGNING_KEY: ${{ secrets.HAHACAM_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::Secret HAHACAM_SIGNING_KEY is missing - debug-signed build, no release"
            exit 0
          fi
          echo "SIGNED=1" >> "$GITHUB_ENV"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:SIGNING_KEY
          echo "HAHACAM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$SIGNING_KEY"
          echo "HAHACAM_KEY_PASSWORD=$SIGNING_KEY" >> "$GITHUB_ENV"

      - name: Build APKs and Play bundle
        run: ./gradlew --no-daemon assemblePlayRelease assemblePersonalRelease bundlePlayRelease

      - name: Collect outputs
        run: |
          mkdir out
          cp app/build/outputs/apk/play/release/app-play-release.apk out/Hahacam.apk
          cp app/build/outputs/apk/personal/release/app-personal-release.apk out/Hahacam-Personal.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab out/Hahacam.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Hahacam-${{ github.sha }}
          path: out/*

      # Новий versionName у app/build.gradle -> автоматичний реліз v<версія>
      - name: Check if this version is already released
        id: ver
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "new=0" >> "$GITHUB_OUTPUT"
          else
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: env.SIGNED == '1' && steps.ver.outputs.new == '1' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hahacam ${{ steps.ver.outputs.tag }}
          files: |
            out/Hahacam.apk
            out/Hahacam.aab
          generate_release_notes: true
