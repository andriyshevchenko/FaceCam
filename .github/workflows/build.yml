name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt upload key
        env:
          SIGNING_KEY: ${{ secrets.FACECAM_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::Secret FACECAM_SIGNING_KEY is missing - building with debug key"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Releases must be signed. Add the FACECAM_SIGNING_KEY secret."
              exit 1
            fi
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:SIGNING_KEY
          echo "FACECAM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$SIGNING_KEY"
          echo "FACECAM_KEY_PASSWORD=$SIGNING_KEY" >> "$GITHUB_ENV"

      - name: Build APKs and Play bundle
        run: ./gradlew --no-daemon assemblePlayRelease assemblePersonalRelease bundlePlayRelease

      - name: Collect outputs
        run: |
          mkdir out
          cp app/build/outputs/apk/play/release/app-play-release.apk out/FaceCam.apk
          cp app/build/outputs/apk/personal/release/app-personal-release.apk out/FaceCam-Personal.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab out/FaceCam.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: FaceCam-${{ github.sha }}
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/FaceCam.apk
            out/FaceCam.aab
          generate_release_notes: true
